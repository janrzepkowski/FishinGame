# StyLua - formatowanie kodu (https://github.com/JohnnyMorganz/StyLua)
#
# Formatowanie NIE jest kwestią gustu w zespole — jest ustalone tutaj i
# wymuszane przez CI (`stylua --check`). Nie dyskutujemy o nim na PR-ach.
#
#   stylua src/            # sformatuj
#   stylua --check src/    # sprawdź bez zmian (to robi CI)

column_width = 100
line_endings = "Unix"
indent_type = "Tabs"
indent_width = 4
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
collapse_simple_statement = "Never"

[sort_requires]
enabled = true
